name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  svg-url-extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run SVG URL extraction Lua tests
        run: SVG_URL_EXTRACTION_LUA_PATH=config/lualib lua5.4 tests/svg_url_extraction_test.lua
      - name: Run SVG URL extraction integration test
        run: |
          docker build -t messaging-email-scanner:svg-test .
          SVG_URL_SKIP_BUILD=1 bash tests/svg_url_extraction_test.sh

  html-link-extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run HTML link extraction integration test
        run: |
          docker build -t messaging-email-scanner:html-link-test .
          HTML_LINK_SKIP_BUILD=1 bash tests/html_link_extraction_test.sh

  homoglyph-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run homoglyph detection Lua tests
        run: |
          HOMOGLYPH_DETECTION_LUA_PATH=config/lualib lua5.4 tests/homoglyph_detection_test.lua
      - name: Run homoglyph detection integration test
        run: |
          docker build -t messaging-email-scanner:homoglyph-test .
          HOMOGLYPH_SKIP_BUILD=1 bash tests/homoglyph_detection_test.sh

  golden-test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run From display impersonation Lua tests
        run: FROM_DISPLAY_IMPERSONATION_LUA_PATH=config/lualib lua5.4 tests/from_display_impersonation_test.lua
      - name: Test golden suite runner
        run: bash tests/golden_test_suite_test.sh
      - name: Run data URI URL extraction Lua tests
        run: DATA_URI_URL_EXTRACTION_LUA_PATH=config/lualib lua5.4 tests/data_uri_url_extraction_test.lua
      - name: Build scanner image
        run: docker build -t messaging-email-scanner:golden-test .
      - name: Run golden test suite
        run: GOLDEN_SKIP_BUILD=1 bash tests/golden_test_suite.sh

  open-redirect-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run open redirect detection Lua tests
        run: |
          OPEN_REDIRECT_DETECTION_LUA_PATH=config/lualib lua5.4 tests/open_redirect_detection_test.lua
      - name: Run open redirect detection integration test
        run: |
          docker build -t messaging-email-scanner:open-redirect-test .
          OPEN_REDIRECT_TEST_IMAGE=messaging-email-scanner:open-redirect-test bash tests/open_redirect_detection_test.sh
