# Bayes classifier — Redis backend (production)
# Uses Redis for shared statistical state across Rspamd replicas

classifier "bayes" {
  tokenizer {
    name = "osb";
  }
  min_learns = 20;
  backend = "redis";
  servers = "redis:6379";
  database = 0;

  statfile {
    symbol = "BAYES_HAM";
    spam = false;
  }
  statfile {
    symbol = "BAYES_SPAM";
    spam = true;
  }

  # MSG-1795: Keep all guarded-learning controls in one included snippet so
  # this strict statistic override cannot drift to a second autolearn object.
  .include(try=false; priority=10) "$LOCAL_CONFDIR/local.d/bayes_autolearn.conf"
}
