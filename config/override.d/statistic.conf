# Bayes classifier — Redis backend (production)
# Uses Redis for shared statistical state across Rspamd replicas

classifier "bayes" {
  tokenizer {
    name = "osb";
  }
  min_tokens = 10;
  min_learns = 20;
  backend = "redis";
  servers = "redis:6379";
  database = 0;

  statfile {
    symbol = "BAYES_HAM";
    spam = false;
  }
  statfile {
    symbol = "BAYES_SPAM";
    spam = true;
  }

  # Single autolearn object — no duplicate boolean
  autolearn {
    spam_threshold = 8.0;
    ham_threshold = -0.5;
    check_balance = true;
    min_balance = 0.9;
  }

  # Restore the packaged learn condition
  learn_condition = 'return require("lua_bayes_learn").can_learn';
}
