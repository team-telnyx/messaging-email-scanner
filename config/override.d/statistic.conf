# Bayes classifier — Redis backend (production)
# Uses Redis for shared statistical state across Rspamd replicas

classifier "bayes" {
  tokenizer {
    name = "osb";
  }
  min_tokens = 1;
  min_learns = 1;
  backend = "redis";
  servers = "redis:6379";
  database = 0;

  statfile {
    symbol = "BAYES_HAM";
    spam = false;
  }
  statfile {
    symbol = "BAYES_SPAM";
    spam = true;
  }

  autolearn = true;
  # Guarded autolearn — only train on confident classifications
  autolearn {
    spam_threshold = 8.0;     # Only learn spam when score >= 8.0
    ham_threshold = -0.5;     # Only learn ham when score < 0
    learning_balance = 0.9;  # Class balancing
  }
}
