# Custom multimap rules — lookalike domains + IP URLs
# These detect known phishing patterns that Bayes and OpenPhish don't cover

# Lookalike domains — known phishing lookalike domains (exact match)
# Score: 5.0 per match. Combined with other symbols → reject threshold (15.0)
LOOKALIKE_DOMAIN {
  type = "from";
  filter = "email:domain";
  map = "${LOCAL_CONFDIR}/maps.d/lookalike_domains.map";
  symbol = "LOOKALIKE_DOMAIN";
  description = "Sender domain is a known lookalike/phishing domain";
  score = 5.0;
  one_shot = true;
}

# IP-based URLs — URLs using IP addresses instead of domains
# Score: 4.0 per match. Combined with HTTP_TO_IP (1.0) → suspicious (7.0+)
IP_URL_SUSPICIOUS {
  type = "url";
  filter = "ipaddr";
  map = "${LOCAL_CONFDIR}/maps.d/ip_urls.map";
  symbol = "IP_URL_SUSPICIOUS";
  description = "URL contains a raw IP address";
  score = 4.0;
  one_shot = true;
}
