# Custom multimap rules — phishing indicators, obfuscated text, and IDN homographs
# Paths must use /etc/rspamd/local.d/maps.d/ (where the files are mounted)

# MSG-1798: character substitutions in decoded message text. The regexp map
# intentionally excludes plain terms except where the ticket explicitly lists
# the canonical term. one_shot limits the contribution to one symbol per part.
# Disabled until the MSG-1791 shadow launch-gate evaluation is complete.
OBFUSCATED_SPAM {
  type = "content";
  filter = "oneline";
  map = "regexp;/etc/rspamd/local.d/maps.d/obfuscated_spam.map";
  symbol = "OBFUSCATED_SPAM";
  description = "Obfuscated spam text detected (character substitution pattern)";
  score = 0.0;
  one_shot = true;
}

# MSG-1798: URL hostnames whose individual DNS labels mix ASCII Latin with
# lookalike Cyrillic/Greek characters or exactly match a protected brand
# lookalike. Disabled until the MSG-1791 shadow launch-gate evaluation completes.
IDN_HOMOGRAPH {
  type = "url";
  filter = "hostname";
  map = "regexp;/etc/rspamd/local.d/maps.d/idn_homograph.map";
  symbol = "IDN_HOMOGRAPH";
  description = "Mixed-script or protected-brand IDN (possible homograph attack)";
  score = 0.0;
  one_shot = true;
}

# Known phishing lookalike domains that are maintained as exact intelligence.
# Keep this separate from the generic LOOKALIKE_DOMAIN Lua callback: Rspamd
# rejects duplicate symbol registrations, which would disable one detector.
KNOWN_LOOKALIKE_DOMAIN {
  type = "from";
  filter = "email:domain";
  map = "/etc/rspamd/local.d/maps.d/lookalike_domains.map";
  symbol = "KNOWN_LOOKALIKE_DOMAIN";
  description = "Sender domain is a known lookalike/phishing domain";
  score = 5.0;
  one_shot = true;
}

# IP-based URLs — uses regexp hostname map for arbitrary IP literals
# Matches any URL whose hostname is a raw IPv4 or IPv6 address
IP_URL_SUSPICIOUS {
  type = "url";
  filter = "hostname";
  map = "regexp;/etc/rspamd/local.d/maps.d/ip_urls.map";
  symbol = "IP_URL_SUSPICIOUS";
  description = "URL hostname is a raw IP address (not a domain)";
  score = 4.0;
  one_shot = true;
}

# Deterministic OpenPhish canary. The public OpenPhish feed is mutable, so a
# synthetic monitor cannot safely assert that an arbitrary feed URL remains
# listed. Use a canary-specific symbol (not PHISHED_OPENPHISH, which is already
# registered by phishing.conf) to exercise the multimap enforcement path.
OPENPHISH_CANARY {
  type = "url";
  filter = "hostname";
  map = "/etc/rspamd/local.d/maps.d/openphish_canary.map";
  symbol = "OPENPHISH_CANARY";
  description = "Deterministic phishing canary URL";
  score = 7.0;
  one_shot = true;
}
