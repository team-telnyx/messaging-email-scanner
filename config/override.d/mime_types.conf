# MIME type checks — bad extensions for outbound
# Detects .exe, .scr, .js, double extensions, macro-enabled docs

bad_extensions = [".exe", ".scr", ".js", ".vbs", ".bat", ".cmd", ".com",
                  ".pif", ".reg", ".vbe", ".wsf", ".wsh", ".ps1"];

# Double extension detection (e.g., invoice.pdf.exe)
double_extensions = true;

# Bad attachment types
bad_attachments = [".docm", ".xlsm", ".pptm", ".jar"];

# Archive inspection limits (Phase 2 — needs ClamAV)
archive_inspection = false;
