# MSG-1848: corpus-calibrated Bayes score.
#
# The 107-message golden corpus shows that BAYES_SPAM is the only tunable
# positive symbol on three otherwise-evading attacks, while no non-fp_stress
# legitimate fixture emits BAYES_SPAM. Keep the HAM weight unchanged so the
# classifier's false-positive relief remains intact. This local.d file merges
# with the built-in statistics group rather than replacing unrelated symbols.
symbols = {
  "BAYES_SPAM" {
    weight = 11.5;
    description = "Message probably spam, probability: ";
  }
  "BAYES_HAM" {
    weight = -3.0;
    description = "Message probably ham, probability: ";
  }
}
