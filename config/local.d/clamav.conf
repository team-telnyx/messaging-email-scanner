# MSG-1783: ClamAV antivirus integration
# Connects to ClamAV daemon for attachment/malware scanning
# CLAM_VIRUS symbol is in DETERMINISTIC_SYMBOLS (MSG-1782)
# CLAM_VIRUS_FAIL symbol indicates ClamAV is unreachable — scanner failure policy applies

clamav {
  # Scanner identity and result symbols
  type = "clamav";
  symbol = "CLAM_VIRUS";
  # Symbol emitted when ClamAV is unavailable — triggers scanner failure handling
  symbol_fail = "CLAM_VIRUS_FAIL";

  # Connection settings
  servers = "clamav:3310";
  
  # Scan attachments and message body
  scan_mime_parts = true;
  scan_all_mime_parts = true;
  
  # Only add symbol if virus found (don't penalize for clean attachments)
  action = "add header";
  
  # Timeout for ClamAV scan
  timeout = 30;  # seconds
  
  # On connection failure, emit CLAM_VIRUS_FAIL so the scanner-failure
  # policy can defer (high-risk) or fail open (normal/trusted) accordingly
  # rather than silently accepting the message
  on_timeout = "scan_fail";
  on_connect_fail = "scan_fail";
  
  # Log level
  log_clean = false;
}
