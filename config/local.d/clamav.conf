# MSG-1783: ClamAV antivirus integration
# Connects to ClamAV daemon for attachment/malware scanning
# CLAM_VIRUS symbol is in DETERMINISTIC_SYMBOLS (MSG-1782)

clamav {
  # Scanner identity and result symbol
  type = "clamav";
  symbol = "CLAM_VIRUS";

  # Connection settings
  servers = "clamav:3310";
  
  # Scan attachments and message body
  scan_mime_parts = true;
  scan_all_mime_parts = true;
  
  # Only add symbol if virus found (don't penalize for clean attachments)
  action = "add header";
  
  # Timeout for ClamAV scan
  timeout = 30;  # seconds
  
  # Log level
  log_clean = false;
}
