# MSG-1797: Tesseract OCR for image-based spam detection
#
# Rspamd 3.10 has no built-in OCR module. config/plugins.d/ocr.lua consumes
# this top-level object through rspamd_config:get_all_opt("ocr").
ocr {
  enabled = true;

  tesseract_bin = "/usr/bin/tesseract";
  timeout_bin = "/usr/bin/timeout";
  language = "eng";

  # Skip small logos/signatures and cap pathological image memory/CPU use.
  min_size = 10240;
  max_size = 10485760;
  mime_types = ["image/png", "image/jpeg", "image/gif", "image/bmp", "image/tiff"];

  # Must complete within KumoMTA's 500ms scanner timeout. Tesseract typically takes 100-300ms per image.
  # Bound work to one image; timeout_ms is a sub-second kill guard.
  max_images = 1;
  timeout_ms = 400;
  max_pixels = 1000000;
  max_output_chars = 8192;

  # A prefilter cannot see the final Rspamd score, so selection uses only the
  # decoded image-content ratio.
  image_ratio_threshold = 0.80;

  # Shed OCR work before it makes an overloaded scanner less healthy. Set a
  # limit to 0 only when an external autoscaler/load-shedder enforces the gate.
  max_connections = 32;
  max_load = 4.0;

  # Inject extracted text into the in-memory MIME task before normal rules and
  # Bayes run. The original message sent by KumoMTA is not modified.
  feed_bayes = true;

  # OCR evidence is scored independently too, so useful detection does not
  # depend on an already-trained Bayes database.
  spam_score = 5.0;
  spam_patterns = [
    "[vw][i1]agra",
    "buy%s+now",
    "free%s+money",
    "limited%s+time%s+offer",
    "claim%s+your%s+prize",
    "crypto%s+investment",
  ];
}
