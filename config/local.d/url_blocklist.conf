# MSG-1829: block URLs present in the combined OpenPhish and URLhaus feed.
multimap {
  PHISHED_URL_BLOCKLIST {
    type = "url";
    # Feed entries are full URLs, not hostnames (the default URL filter).
    filter = "full";
    map = "$LOCAL_CONFDIR/local.d/maps.d/url_blocklist.map";
    symbol = "PHISHED_URL_BLOCKLIST";
    score = 8.0;
    description = "URL found in phishing/malware blocklist";
    require_filter = false;
  }
}
