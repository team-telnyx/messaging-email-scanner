# MSG-1876: identify URLs hidden behind common shortening services.
# The low score is intended to combine with urgency, credential, and other
# phishing signals rather than classify short URLs as malicious on their own.
multimap {
  SHORT_URL_FLAG {
    type = "url";
    filter = "hostname";
    map = "${SHORT_URL_SERVICES_MAP}";
    symbol = "SHORT_URL_FLAG";
    score = 2.0;
    description = "URL uses a common shortening service";
    one_shot = true;
  }
}
