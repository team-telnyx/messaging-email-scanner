# MSG-1781: Trusted sender score relief
# Applied when KumoMTA passes Settings-ID: trusted header
# Trusted customers get a higher reject threshold (20.0 vs 15.0)
# Trusted senders still get malware + phishing checks — only score threshold is relaxed
# NOTE: Authorization, expiry, and audit for trusted status are handled by
# the appeals triage workflow (MSG-1793). This config only defines the Rspamd
# score relief. The risk_class=trusted metadata is set by behavioral
# protections (MSG-1780) after support review.

trusted {
  id = "trusted";
  priority = higher;
  apply {
    # Keep the trusted profile aligned with outbound. A separate Settings-ID
    # rule does not inherit outbound's disabled sender-IP/authentication checks.
    symbols_disabled = [
      "RBL_SPAMHAUS",
      "RECEIVED_SPAMHAUS",
      "RBL_SPAMHAUS_SBL",
      "RBL_SPAMHAUS_CSS",
      "RBL_SPAMHAUS_XBL",
      "RBL_SPAMHAUS_PBL",
      "RECEIVED_SPAMHAUS_SBL",
      "RECEIVED_SPAMHAUS_CSS",
      "RECEIVED_SPAMHAUS_XBL",
      "RECEIVED_SPAMHAUS_PBL",
      "RBL_SPAMHAUS_BLOCKED_OPENRESOLVER",
      "RECEIVED_SPAMHAUS_BLOCKED_OPENRESOLVER",
      "MAILSPIKE",
      "RBL_SENDERSCORE_REPUT_UNKNOWN",
      "RBL_SENDERSCORE_REPUT_BLOCKED",
      "RBL_SEM",
      "RBL_SEM_IPV6",
      "RCVD_IN_DNSWL",
      "DNSWL_BLOCKED",
      "DWL_DNSWL",
      "RBL_VIRUSFREE_UNKNOWN",
      "RBL_NIXSPAM",
      "RBL_NIXSPAM_FAIL",
      "BLOCKLISTDE_CHECK",
    ];

    groups_disabled = ["spf", "dmarc"];

    actions {
      reject = 20.0;
      "add header" = 10.0;
      greylist = null;
      "rewrite subject" = null;
    }
  }
}
