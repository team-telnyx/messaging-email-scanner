# Phishing module — keys only, NO wrapper
# local.d/phishing.conf is included INSIDE the packaged phishing {} block
# Adding a phishing {} wrapper causes a nested section error

openphish_enabled = true;
openphish_map = "https://raw.githubusercontent.com/openphish/public_feed/refs/heads/main/feed.txt";
openphish_symbol = "PHISHED_OPENPHISH";
openphish_score = 7.0;

phishtank_enabled = false;

# Check display text vs href mismatch
check_display = true;
check_domains_only = false;
