# Phishing detection — OpenPhish feed + built-in phishing module
# OpenPhish feed is fetched as HTTPS map (or mounted as file)

phishing {
  # Built-in phishing symbol checks display/href URL mismatch
  symbol = "PHISHING";

  # OpenPhish feed — known phishing URLs
  openphish_enabled = true;
  openphish_map = "https://www.openphish.com/feed.txt";
  openphish_symbol = "PHISHED_OPENPHISH";
  openphish_score = 7.0;

  # PhishTank (optional, needs API key)
  phishtank_enabled = false;

  # Check display text vs href mismatch
  check_display = true;
  check_domains_only = false;
}
