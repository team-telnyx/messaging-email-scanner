# MIME type checks — override bad_extensions multiplier for outbound
# This file is included INSIDE the mime_types {} block
# The plugin reads bad_extensions as a map: extension -> multiplier
# Top-level keys like "scr = 4.0" are IGNORED by the plugin

# Override multipliers for specific extensions (merged with packaged defaults)
bad_extensions {
  scr = 4.0;
  js = 3.0;
  vbs = 4.0;
  bat = 2.0;
  cmd = 2.0;
  com = 3.0;
  pif = 3.0;
  reg = 2.0;
  vbe = 4.0;
  wsf = 3.0;
  wsh = 3.0;
  ps1 = 3.0;
  jar = 2.0;
}
