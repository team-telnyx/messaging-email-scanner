# MSG-1795: Guarded Bayes autolearn configuration
#
# This file is included from inside the single classifier "bayes" object in
# override.d/statistic.conf. Do not wrap it in another classifier block.
# Only autolearn from unambiguous scores; borderline messages must be reviewed.

# Do not learn from messages with too little content to produce useful tokens.
min_tokens = 10;

autolearn {
  # Rspamd 3.10 compares these thresholds inclusively.
  spam_threshold = 15.0;
  ham_threshold = -2.0;

  # Retain the built-in class-balance guard as a second poisoning control.
  check_balance = true;
  min_balance = 0.9;
}

# Deterministic policy symbols are blocked by policy, not statistical evidence.
# Exclude them from automatic and manual learns, while still allowing an
# operator to unlearn an existing contaminated sample.
learn_condition = 'local base = require("lua_bayes_learn").can_learn; return function(task, is_spam, is_unlearn) if not is_unlearn and (task:has_symbol("CLAM_VIRUS") or task:has_symbol("PHISHED_OPENPHISH")) then return false, "deterministic policy symbol excluded from Bayes learning" end return base(task, is_spam, is_unlearn) end';
