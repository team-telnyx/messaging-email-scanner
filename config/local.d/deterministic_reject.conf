# MSG-1782: Deterministic reject mode configuration
# Applied when RSPAMD_SCAN_MODE=deterministic_reject
# Only messages with high-confidence symbols (CLAM_VIRUS, PHISHED_OPENPHISH) are rejected
# Other reject-level scores are observed (not rejected) in this mode

outbound {
  id = "outbound";
  priority = high;
  apply {
    actions {
      reject = 15.0;
      "add header" = 6.0;
      greylist = null;
      "rewrite subject" = null;
    }
  }
}
