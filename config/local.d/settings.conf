# Outbound scanner profile — Settings-ID: outbound
# Applied when KumoMTA passes Settings-ID: outbound header
# Disables inbound-only checks, sets outbound thresholds

outbound {
  id = "outbound";
  priority = high;
  apply {
    # Disable inbound-only checks for authenticated outbound
    groups_disabled = ["rbl", "spf", "dmarc"];

    actions {
      reject = 15.0;
      "add header" = 6.0;
      greylist = null;       # No greylisting for outbound
      "rewrite subject" = null;  # No subject rewriting for outbound
    }
  }
}
