# Outbound scanner profile — Settings-ID: outbound
# Applied when KumoMTA passes Settings-ID: outbound header
# Disables inbound-only sender checks, keeps URL/Domain reputation (DBL/SURBL/URIBL)

outbound {
  id = "outbound";
  priority = high;
  apply {
    # Disable only inbound sender-IP checks — NOT the entire rbl group
    # The rbl group includes URL reputation (DBL, SURBL, URIBL) which IS needed for outbound
    symbols_disabled = [
      "RBL_SPAMHAUS", "RBL_SPAMHAUS_SBL", "RBL_SPAMHAUS_XBL",
      "RBL_MAILSPIKE", "RBL_SEM", "RBL_INTERSEC", "RBL_BARRACUDA",
      "RBL_UCEPROTECT1", "RBL_UCEPROTECT2", "RBL_UCEPROTECT3",
      "RECEIVED_SPAMHAUS", "RECEIVED_SPAMHAUS_SBL", "RECEIVED_SPAMHAUS_XBL",
      "DNSWL_BLOCKED"
    ];

    # SPF/DKIM/DMARC not relevant for outbound scanning — we are the sender
    groups_disabled = ["spf", "dmarc"];

    actions {
      reject = 15.0;
      "add header" = 6.0;
      greylist = null;       # No greylisting for outbound
      "rewrite subject" = null;  # No subject rewriting for outbound
    }
  }
}
