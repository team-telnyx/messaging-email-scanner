# Outbound scanner profile — Settings-ID: outbound
# Applied when KumoMTA passes Settings-ID: outbound header
# Disables inbound-only sender-IP checks, keeps URL/Domain reputation (DBL/SURBL/URIBL)

outbound {
  id = "outbound";
  priority = high;
  apply {
    # Disable sender-IP RBL symbols (inbound-only checks)
    # These are the actual symbol names in Rspamd 3.10.2 (verified via configdump)
    # URL reputation (DBL, SURBL, URIBL) is in a separate group and stays active
    symbols_disabled = [
      "RBL_SPAMHAUS",
      "RECEIVED_SPAMHAUS",
      "RBL_SPAMHAUS_SBL",
      "RBL_SPAMHAUS_CSS",
      "RBL_SPAMHAUS_XBL",
      "RBL_SPAMHAUS_PBL",
      "RECEIVED_SPAMHAUS_SBL",
      "RECEIVED_SPAMHAUS_CSS",
      "RECEIVED_SPAMHAUS_XBL",
      "RECEIVED_SPAMHAUS_PBL",
      "RBL_SPAMHAUS_BLOCKED_OPENRESOLVER",
      "RECEIVED_SPAMHAUS_BLOCKED_OPENRESOLVER",
      "MAILSPIKE",
      "RBL_SENDERSCORE_REPUT_UNKNOWN",
      "RBL_SENDERSCORE_REPUT_BLOCKED",
      "RBL_SEM",
      "RBL_SEM_IPV6",
      "RCVD_IN_DNSWL",
      "DNSWL_BLOCKED",
      "DWL_DNSWL",
      "RBL_VIRUSFREE_UNKNOWN",
      "RBL_NIXSPAM",
      "RBL_NIXSPAM_FAIL",
      "BLOCKLISTDE_CHECK",
    ];

    # SPF/DKIM/DMARC not relevant for outbound scanning — we are the sender
    groups_disabled = ["spf", "dmarc"];

    actions {
      reject = 15.0;
      "add header" = 6.0;
      greylist = null;       # No greylisting for outbound
      "rewrite subject" = null;  # No subject rewriting for outbound
    }
  }
}
